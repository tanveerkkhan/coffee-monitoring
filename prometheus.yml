global:
  scrape_interval: 15s        # how often to pull /metrics
  evaluation_interval: 15s    # how often to check alert rules

rule_files:
  - "alert.yml"               # resolves to /etc/prometheus/alert.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "coffee-app"
    static_configs:
      - targets: ["app:5000"]          # service name from docker-compose

  - job_name: "node"
    static_configs:
      - targets: ["node_exporter:9100"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
